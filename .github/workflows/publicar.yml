# Publica wiqonlab.com con GitHub Pages y actualiza los datos dinámicos sin
# llenar el historial del repo: noticias.json, cambio.json, videos.json y
# salud.json se generan en cada corrida y se publican directamente.
name: Publicar sitio y actualizar datos

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # News Radar cada 30 minutos (GitHub puede demorar algunos minutos)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas de los lectores de datos (si fallan, no se publica y queda la versión anterior)
        run: |
          pip install --quiet pytest==8.3.3
          python -m pytest tests -q -p no:cacheprovider
      - name: Traer los últimos datos publicados (respaldo si una fuente falla)
        run: |
          for f in noticias.json cambio.json videos.json inflacion.json defi.json; do
            curl -sf "https://wiqonlab.com/$f" -o "$f.pub" && mv "$f.pub" "$f" || rm -f "$f.pub"
          done
      - name: News Radar
        run: python scripts/actualizar_noticias.py
        continue-on-error: true
      - name: Tipo de cambio oficial
        run: python scripts/actualizar_cambio.py
        continue-on-error: true
      - name: Videos de YouTube
        run: python scripts/actualizar_videos.py
        continue-on-error: true
      - name: Inflación por país (FMI)
        run: python scripts/actualizar_inflacion.py
        continue-on-error: true
      - name: Stablecoins y DeFi (DefiLlama)
        run: python scripts/actualizar_defi.py
        continue-on-error: true
      - name: Páginas SEO con los valores actuales
        run: python scripts/construir_seo.py
        continue-on-error: true
      - name: Portada con los últimos datos (sin JavaScript también se ven)
        run: python scripts/rellenar_inicio.py
        continue-on-error: true
      - name: Salud de los datos (salud.json, lo leen la página y el aviso de n8n)
        run: python scripts/salud.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
